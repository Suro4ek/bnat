{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bnat · {{.Domain}}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--code:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8eb;--muted:#9aa1ab;--line:#2a2f3a;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--code:#222632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .in{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:20px;align-items:center;height:52px}
header b{font-size:16px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
nav a.on,nav a:hover{color:var(--fg);background:var(--code)}
main{max-width:1100px;margin:0 auto;padding:20px 16px}
h2{font-size:15px;margin:28px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
code,pre{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:2px 6px;border-radius:4px;word-break:break-all}
pre{padding:10px 12px;white-space:pre-wrap;margin:8px 0}
.muted{color:var(--muted)}
.empty{padding:20px;color:var(--muted);text-align:center}
form.inline{display:inline}
form.add{padding:14px;display:grid;gap:10px}
form.add .row{display:flex;gap:10px;flex-wrap:wrap}
form.add .row>*{flex:1;min-width:180px}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:70px}
button{padding:7px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.link{background:none;color:var(--bad);padding:0}
button.ghost{background:none;color:var(--muted);padding:6px 8px}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;border:1px solid}
.msg.err{color:var(--bad);border-color:var(--bad)}
.msg.ok{color:var(--ok);border-color:var(--ok)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.on{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.hint{padding:12px 14px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
{{if ne .Page "login"}}
<header><div class="in">
<b>bnat</b>
<nav>
<a href="/" {{if eq .Page "tunnels"}}class="on"{{end}}>Tunnels</a>
<a href="/keys" {{if eq .Page "keys"}}class="on"{{end}}>SSH keys</a>
<a href="/domains" {{if eq .Page "domains"}}class="on"{{end}}>Domains</a>
<a href="/clients" {{if eq .Page "clients"}}class="on"{{end}}>Clients</a>
</nav>
<form class="inline" method="post" action="/logout"><button class="ghost">Log out</button></form>
</div></header>
{{end}}
<main>
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
{{if .Flash}}<div class="msg ok">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
